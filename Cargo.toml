[package]
name = "ikigai-compress"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compression as resources for ikigai: urn:compress:* / urn:decompress:* — deterministic gzip and zlib endpoints that are also registered transreptors, with a decompression bound that refuses rather than truncates."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-compress"
homepage = "https://github.com/ikigai-rs/ikigai-compress"
readme = "README.md"
keywords = ["ikigai", "roc", "gzip", "compression", "module"]
categories = ["wasm", "compression"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
ikigai-core = "0.1.37"
