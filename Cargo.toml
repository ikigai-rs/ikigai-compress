[package]
name = "ikigai-compress"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Compression as resources for ikigai: urn:compress:* / urn:decompress:* — deterministic gzip and zlib endpoints that are also registered transreptors, with a decompression bound that refuses rather than truncates."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-compress"
homepage = "https://github.com/ikigai-rs/ikigai-compress"
readme = "README.md"
keywords = ["ikigai", "roc", "gzip", "compression", "module"]
categories = ["wasm", "compression"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.89 is the true minimum: `space_iri` (the `urn:iki:space:` name `space()`
# claims), and the `bind` that drops a name, so naming LAST is what makes the
# claim true (ledger #987). The rest of the module is much older — the ArgSpec
# era (0.1.37) and the transreptor half (0.1.22/0.1.23) — so the name sets the
# floor. Under 0.x a caret is a range: this admits every 0.1.x from 0.1.89 on.
ikigai-core = "0.1.89"
# The compression backend. `rust_backend` (miniz_oxide) with default features OFF:
# pure Rust, no C toolchain, and it compiles to wasm32-unknown-unknown. The
# default feature set pulls a C/zlib backend — a machine dependency this ecosystem
# has already been bitten by (an Xcode licence lapse took out `cc` on both machines
# this month), and one a wasm face cannot have at all.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once.
ikigai-conformance = "0.8.0"
# ★ The REPL engine, for `tests/pipeline.rs`. This module's whole point is
# `source urn:file:x | urn:compress:gzip`, and the routing rule that makes that work
# (a Source fills the ONE declared argument left unnamed) lives in the engine, not
# the kernel — so a kernel-only test cannot see it. Neither can the conformance
# suite, which also calls the kernel and names `content` explicitly.
# 0.1.43 is the release verified against core 0.1.89: 0.1.23 pulls an
# `ikigai-resolve` that predates core's `Resolved` flag day (0.1.78) and no
# longer compiles beside the core floor above.
ikigai-engine = "0.1.43"
# The engine reads each contract as `Meta as=application/json`; the test kernel has
# to be able to answer, or the engine fails open and the pipeline tests prove nothing.
serde_json = "1"
